# Compiler-owned delivery; no JavaScript post-minifier or export rewriting.
[policy]
version = 3
[javascript]
# Plain-data reads must not run getters; disable for effectful accessor integrations.
assume_pure_property_reads = true
priority = "size-first"
# Assumes unpatched platform builtins; disable when consumers replace them.
assume_pristine_builtins = true
# Remove debugLog instrumentation; ordinary print and host console effects remain.
strip_debug = true

# Preserved effort setting. 13 favors size; 14/15 allow more expensive marginal searches.
[effort]
level = 13

# Optimize the delivered files for this codec, independently of raw/gzip objectives.
[objective]
codecs = "brotli"
[mangle]
identifiers = true
properties = true
pool_strings = false

# The core is an external provider during compilation, so clean builds do not
# read generated dist/. Map it to the installed sibling artifact for each format.
[delivery]
mode = "single"
directory = "."
host_modules = "external"
entry_names = "contrib/auto-render.mjs"
[delivery.external_specifiers]
"@itslil/katex" = "./katex.mjs"
[delivery.entries]
entry = "../contrib/auto-render/auto-render.lil"
[[delivery.also]]
name = "cjs"
format = "cjs"
exports = "default"
entry_names = "contrib/auto-render.cjs"
external_specifiers = {"@itslil/katex" = "./katex.cjs"}
[[delivery.also]]
name = "browser"
format = "iife"
exports = "default"
global = "renderMathInElement"
global_binding = "property"
entry_names = "contrib/auto-render.min.js"
globals = {"@itslil/katex" = "katex"}

[policy.resources]
logical_work = 16000000000

[execution]
jobs = 1
