# Compiler-owned delivery; no JavaScript post-minifier or export rewriting.
[policy]
version = 3

[policy.tactics]
# Permit one-time constant-table decoding for smaller downloads.
# Runtime reads must not acquire recurring reconstruction work.
startup-reconstruction = "on"
recurring-reconstruction = "off"
string-array-packing = "off"

[javascript]
# Plain-data reads must not run getters; disable for effectful accessor integrations.
assume_pure_property_reads = true
priority = "size-first"
# Assumes unpatched platform builtins; disable when consumers replace them.
assume_pristine_builtins = true
# Remove debugLog instrumentation; ordinary print and host console effects remain.
strip_debug = true

# Preserved effort setting. 13 favors size; 14/15 allow more expensive marginal searches.
[effort]
level = 13

# Optimize the delivered files for this codec, independently of raw/gzip objectives.
[objective]
codecs = "brotli"
[mangle]
identifiers = true
properties = true
pool_strings = false

[delivery]
mode = "single"
directory = "."
select = ["katex"]
entry_names = "katex.esm.js"
[delivery.entries]
katex = "src/entry.lil"
default = "src/package-default.lil"
test = "test/katex.lil"
contrib-test = "test/support.lil"
metrics = "test/metrics.lil"
[[delivery.also]]
name = "cjs"
format = "cjs"
entries = ["default"]
exports = "default"
entry_names = "katex.cjs"
[[delivery.also]]
name = "browser"
format = "iife"
entries = ["default"]
exports = "default"
global = "katex"
global_binding = "property"
entry_names = "katex.umd.js"
[[delivery.also]]
name = "test"
entries = ["test"]
entry_names = "katex.test.js"
[[delivery.also]]
name = "contrib-test"
entries = ["contrib-test"]
entry_names = "katex.contrib-test.js"
[[delivery.also]]
name = "metrics"
entries = ["metrics"]
entry_names = "katex.metrics.mjs"

[policy.resources]
logical_work = 16000000000

[execution]
jobs = 1
