# Compiler-owned delivery; no JavaScript post-minifier or export rewriting.
[policy]
version = 3
[javascript]
# Plain-data reads must not run getters; disable for effectful accessor integrations.
assume_pure_property_reads = true
priority = "size-first"
# Assumes unpatched platform builtins; disable when consumers replace them.
assume_pristine_builtins = true
# Remove debugLog instrumentation; ordinary print and host console effects remain.
strip_debug = true

# Preserved effort setting. 13 favors size; 14/15 allow more expensive marginal searches.
[effort]
level = 13

# Optimize the delivered files for this codec, independently of raw/gzip objectives.
[objective]
codecs = "brotli"
[mangle]
identifiers = true
properties = true
pool_strings = false

# External paths describe the installed package, not the source directory.
[delivery]
mode = "single"
directory = "."
host_modules = "embed"
entry_names = "contrib/copy-tex.mjs"
[delivery.external_specifiers]
"../../dist/katex.mjs" = "./katex.mjs"
[delivery.entries]
entry = "contrib/copy-tex/copy-tex.lil"
[[delivery.also]]
name = "cjs"
format = "cjs"
exports = "named"
entry_names = "contrib/copy-tex.cjs"
external_specifiers = {"../../dist/katex.mjs" = "./katex.cjs"}
[[delivery.also]]
name = "browser"
format = "iife"
exports = "named"
global = "katexCopyTex"
global_binding = "property"
entry_names = "contrib/copy-tex.min.js"
globals = {"../../dist/katex.mjs" = "katex"}
