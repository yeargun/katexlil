# closed LilScript world. It used to differ from the open config only by
# `extern_fields = false`; the one compiler renames no property, so that key has
# no effect and was removed. The two configs are now the same, and so are the two
# artifacts. The lane stays so the site keeps showing both worlds side by side.
[javascript]
assume_pure_property_reads = true
priority = "size-first"
optimization_level = 13
terminal_codec_probe_limit = 256
cost_model = "brotli"
assume_pristine_builtins = true
strip_console = true
candidate_search = "always"

[mangle]
identifiers = true
properties = true
pool_strings = false
